services:
  - type: web
    name: scamshield-api
    runtime: python
    region: singapore
    buildCommand: "pip install -r cloud/requirements.txt"
    startCommand: "cd cloud && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: scamshield-db
          property: connectionString
      - key: SWYTCHCODE_API_KEY
        sync: false
      - key: LYZR_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: N8N_API_KEY
        sync: false
      - key: N8N_WEBHOOK_BASE_URL
        sync: false

  # Signaling Server for WebRTC (Node.js)
  - type: web
    name: scamshield-signaling
    runtime: node
    region: singapore
    buildCommand: "cd app/backend && npm install"
    startCommand: "cd app/backend && node server.js"
    envVars:
      - key: PORT
        value: 3000

  # React Frontend (Static Site)
  - type: web
    name: scamshield-frontend
    env: static
    region: singapore
    buildCommand: "cd app/frontend && npm install && npm run build"
    staticPublishPath: "./app/frontend/dist"
    envVars:
      - key: VITE_SOCKET_URL
        value: "https://scamshield-signaling.onrender.com"

databases:
  - name: scamshield-db
    region: singapore
    plan: free
